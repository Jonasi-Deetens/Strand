[package]
name = "strand"
version = "0.1.0"
description = "Strand - 2D beach designer and build tracker for a beach bar"
authors = ["Strand"]
edition = "2021"
# A transitive dependency of the SQL plugin needs edition 2024.
rust-version = "1.85"

[lib]
name = "strand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major as tauri-plugin-sql pulls in, so the pool taken out of its state
# type checks against this sqlx.
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "json",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
